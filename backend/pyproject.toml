[project]
name = "ensai_it_project_2A_team34_back"
version = "0.1.0"
description = "API for the 2nd year IT project of team 34"
authors = [{ name = "MANAMBIRAVAKA Anaëlle" }, { name = "NADIN Sarah" },
{ name = "NICOLIE Galahade" }, { name = "PERRIN-BEAU Madie" },
{ name = "VILARRUPLA Thomas" }, { name = "ZHU Annabelle" }, 
]
requires-python = ">=3.13"

dependencies = [
    "fastapi",
    "inquirerPy",
    "psycopg2-binary",
    "python-dotenv",
    "pydantic[email]",
    "PyYAML",
    "requests",
    "regex",
    "uvicorn",
    "cvss",
    "reportlab",
    "pypdf",
    "cryptography"
]

# Dependencies used only for development, not for runtime
[project.optional-dependencies]
dev = ["bandit", "coverage", "pylint", "pytest", "ruff"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" } # source files are in folder src

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["*test*.py"]
markers = [
    "network: tests qui font de vrais appels réseau (lents, dépendent d'Internet)",
]
addopts = '-v -s -m "not network"'

[tool.coverage.run]
branch = true
include = ["src/service/*", "src/dao/*"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true

[tool.coverage.html]
directory = "coverage_report"

[dependency-groups]
dev = [
    "black>=26.10.1",
]
