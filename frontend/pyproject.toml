[project]
name = "ensai_it_project_2A_team34_front"
version = "0.1.0"
description = "User interface template for the 2nd year IT project of team 34"
authors = [{ name = "MANAMBIRAVAKA Anaëlle" }, { name = "NADIN Sarah" },
{ name = "NICOLIE Galahade" }, { name = "PERRIN-BEAU Madie" },
{ name = "VILARRUPLA Thomas" }, { name = "ZHU Annabelle" }, 
]
requires-python = ">=3.13"

dependencies = ["pandas", "python-dotenv", "PyYAML", "requests", "streamlit"]

[project.optional-dependencies]
dev = ["bandit", "coverage", "pylint", "pytest", "ruff"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["*test*.py"]
addopts = "-v -s"
