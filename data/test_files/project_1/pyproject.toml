[project]
name = "cleanops-sample"
version = "0.1.0"
description = "Projet d'exemple pour tester CleanOps"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # CVE connues
    "requests==2.19.1",
    "PyYAML==5.3.1",
    "Django==2.2.0",
    "Flask==0.12.2",
    "Jinja2==2.10",
    "urllib3==1.24.1",
    "Pillow==8.0.0",
    # Licences à risque
    "PyQt5==5.15.9",
    "mysql-connector-python==8.0.33",
    "gnureadline==8.1.2",
    # Sains
    "click==8.1.7",
    "rich==13.7.1",
    # Cas limites
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.4",
    "ruff==0.4.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
